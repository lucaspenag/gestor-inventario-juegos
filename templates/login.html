{% extends "base.html" %}
{% block titulo %}Iniciar sesion - {{ nombre_sistema }}{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card sombra-suave">
            <div class="card-body p-4">
                <h1 class="h4 mb-1">Mesa Chica</h1>
                <p class="text-muted small mb-4">Gestor de inventario de la tienda de juegos de mesa</p>

                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="nombre@tiendadejuegos.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contrasena</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Iniciar sesion</button>
                </form>

                {% if google_activo %}
                <div class="separador my-4"><span>o</span></div>
                <a href="{{ url_for('auth.login_google') }}" class="btn btn-outline-secondary w-100">
                    Iniciar sesion con Google
                </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
